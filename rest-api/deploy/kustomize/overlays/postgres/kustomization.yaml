# Overlay for postgres. Bumps container resources beyond the tight base
# defaults (cpu=500m / memory=512Mi) that starved the DB under mock inventory
# sync load, causing UpdateXxxInDB activities to hit their 30s StartToClose
# timeout because queries were being cancelled client-side.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base/postgres

patches:
  - target:
      kind: StatefulSet
      name: postgres
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2"
